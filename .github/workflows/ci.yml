# Метаболизм клетки на хостинге: verify (fail-closed) + приёмки на каждый push/PR.
# Cross-тесты с живым домом включаются сами, если рядом клон commons — их отсутствие
# честно помечается skip'ом (AGENTS.md, правило 5: офлайн-first, сеть не обязательна).
name: metabolism

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch: # волна ×4: диспетч по требованию (проверка секрета memory без пустых пушей)
jobs:
  cell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify — геном/ДНК/голос/согласия fail-closed
        run: make verify
      - name: tests — приёмки грамматик и прививки
        run: make test
      - name: "memory — сверка памяти роя: цепь+свежесть+источники живым API"
        env:
          # волна ×6: публичные источники читаются штатным job-токеном — ротация
          # PAT не слепит память; PAT остаётся только для cross-repo dispatch.
          GH_TOKEN: ${{ secrets.CELL_SWARM_DISPATCH_TOKEN || github.token }}
        run: make memory
