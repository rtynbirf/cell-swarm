# Метаболизм клетки на хостинге: verify (fail-closed) + приёмки на каждый push/PR.
# Cross-тесты с живым домом включаются сами, если рядом клон commons — их отсутствие
# честно помечается skip'ом (AGENTS.md, правило 5: офлайн-first, сеть не обязательна).
# Протокол тишины A-HUSH (волна ×1176, 2026-11-18): step «memory» получает грейс
# 3×60 с (дрейф такта — память догоняет пуш — не тревога); страж получает
# «тревогу однажды»: issue alarm:metabolism открывается один раз и разряжается
# при зелёном такте.
name: metabolism

permissions:
  contents: read
  issues: write

on:
  push:
  pull_request:
  workflow_dispatch: # волна ×4: диспетч по требованию (проверка секрета memory без пустых пушей)
concurrency:
  group: metabolism
  cancel-in-progress: false

jobs:
  cell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify — геном/ДНК/голос/согласия fail-closed
        run: make verify
      - name: tests — приёмки грамматик и прививки
        run: make test
      - name: "memory — сверка памяти роя: цепь+свежесть+источники живым API (грейс A-HUSH)"
        env:
          # волна ×6: публичные источники читаются штатным job-токеном — ротация
          # PAT не слепит память; PAT остаётся только для cross-repo dispatch.
          # волна ×23 (2026-11-13, дом singulyar, «закрытие тылов»): секрет
          # CELL_SWARM_DISPATCH_TOKEN хранит отозванный PAT — job-токен ловил
          # 401 на всех 4 источниках (MEM-0001..0004; раны metabolism на догонах
          # пина ×22 d2106dc2 и ×23 4c2f6934). Источники публичны (runtime-protocol,
          # nous, cell-swarm), sha256 на пинах сходится — память читает job-токен;
          # PAT для cross-repo dispatch живёт в своих шагах.
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if make memory; then echo "память сверена (попытка $i)"; exit 0; fi
            echo "память красная — возможен дрейф такта, перепроверка через 60 с (попытка $i/3)"
            sleep 60
          done
          echo "память красная надлого — честный красный"
          exit 2
      - name: Разоружение (метаболизм зелёный — страж молчит и снова вооружён)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --label "alarm:metabolism" --json number -q '.[].number' \
            | while read n; do gh issue close "$n" -R "$GITHUB_REPOSITORY" -c "метаболизм зелёный (run ${{ github.run_id }}) — страж разряжен, тревога снята"; done
      - name: Тревога однажды (circuit breaker)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "alarm:metabolism" -R "$GITHUB_REPOSITORY" --color b60205 --description "метаболизм: красный надлого" --force 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label "alarm:metabolism" --json number -q 'length')
          if [ "$open" -eq 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              -t "ALARM: метаболизм красный надлого" \
              -b "run ${{ github.run_id }} — verify/test/memory красный после 3 перепроверок. Пока issue открыта — страж молчит (протокол A-HUSH)." \
              -l "alarm:metabolism"
          else
            echo "тревога уже открыта ($open) — молчим"
          fi
