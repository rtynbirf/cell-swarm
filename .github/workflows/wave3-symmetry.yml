name: wave3-symmetry
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  symmetry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Гейт симметрии sNN<->sNN + витрина ниши «0 процессных»
        run: python3 tools/wave3/symmetry.py check

      - name: Закрепить симметричную карту (если обновилась)
        if: ${{ always() }}   # карта нужна и красной: окраска односторонних связей — результат
        run: |
          if [ -n "$(git status --porcelain peers)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add peers/pairs.json peers/SYMMETRY-MAP.md
            git commit -m "wave3: симметричная карта генома и витрина ниши"
            git pull --rebase origin main || true
            git push
          else
            echo "карта без изменений"
          fi
