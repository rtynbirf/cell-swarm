# Событийная сверка генома (Закон 3, ADR-0002 клетки runtime-protocol —
# механизм «живая карта» применён к самой карте роя):
# клетка пушилась → repository_dispatch «cell-pushed» → геном перерисовывает
# пины живым ls-remote и, если был дрейф, вписывает факт коммитом.
# Не по времени, не по накоплению: событие само вписывает факт (TH-RTP-04).
# Ручной запуск сохранён (workflow_dispatch) — для сверки без события.
name: genome-reconcile

on:
  repository_dispatch:
    types: [cell-pushed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: сверка-контур — перечитать территорию → пины живым ls-remote → вписать факт → повторить до схождения (гонка 2631bd6, урок TH-RTP-06)
        run: |
          git config user.name "genome-reconcile"
          git config user.email "agent@rtynbirf.local"
          for attempt in 1 2 3; do
            # актюатор перечитывает территорию НЕПОСРЕДСТВЕННО перед действием:
            # карта на входе цикла может быть старше main (гонка с параллельным пушем)
            git fetch origin main --quiet
            git rebase --autostash origin/main --quiet || git rebase --abort
            python3 scripts/pin.py --write
            if git diff --quiet swarm.json; then
              echo "дрейфа нет — геном свеж; событие сверилось и растворилось (попытка $attempt)"
              exit 0
            fi
            git add swarm.json
            git commit -m "genome: пин догнан за телом событием пуша клетки (автомат, TH-RTP-04)"
            if git push; then
              echo "факт вписан с попытки $attempt"
              exit 0
            fi
            echo "гонка: территория ушла во время записи — перечитать и повторить (попытка $attempt)"
          done
          echo "территория не пустила за 3 попытки — следующий пуш клетки сам запустит сверку заново (level-triggered)"
          exit 1
