name: wave3-blood-sdk
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: python -m blood_sdk.selftest (golden из LEDGER, идемпотентный PUT, отказы, schema)
        run: python3 -m blood_sdk.selftest

      - name: Закрепить выращенные golden-пробы и schema.json (если появились)
        run: |
          if [ -n "$(git status --porcelain blood_sdk)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blood_sdk
            git commit -m "wave3: golden-пробы и schema.json выращены из blood/LEDGER.jsonl"
            git push
          else
            echo "новых артефактов нет — golden уже в репо"
          fi
